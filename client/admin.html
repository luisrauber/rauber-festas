<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Rauber Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Cores dos status */
        .status-NAO_PAGO { border-left: 5px solid #dc3545; background-color: #fff5f5; }
        .status-PARCIAL { border-left: 5px solid #ffc107; background-color: #fffff0; }
        .status-PAGO { border-left: 5px solid #198754; background-color: #f0fff4; }
        .status-CONCLUIDO { border-left: 5px solid #6c757d; background-color: #e9ecef; opacity: 0.8; }
        
        /* Ajuste do Calendário no Modal */
        #calendarAdmin {
            max-height: 70vh;
        }
        .fc-event { cursor: pointer; }
    </style>
</head>
<body class="bg-light">

    <div id="tela-login" class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow p-4" style="width: 400px;">
            <h3 class="text-center mb-4">Acesso Restrito</h3>
            <form id="form-login">
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" value="admin@rauber.com">
                </div>
                <div class="mb-3">
                    <label>Senha</label>
                    <input type="password" id="senha" class="form-control" value="rauber123">
                </div>
                <button type="submit" class="btn btn-gold w-100">Entrar</button>
            </form>
        </div>
    </div>

    <div id="tela-painel" class="d-none">
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container">
                <span class="navbar-brand">Painel Administrativo</span>
                <button onclick="logout()" class="btn btn-outline-light btn-sm">Sair</button>
            </div>
        </nav>

        <div class="container">
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#reservas-tab">Agenda & Pagamentos</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#galeria-tab">Gerenciar Galeria</button>
                </li>
            </ul>

            <div class="tab-content p-4 bg-white border border-top-0 shadow-sm">
                
                <div class="tab-pane fade show active" id="reservas-tab">
                    
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">Adicionar Novo Evento</h5>
                        <button class="btn btn-info text-white" data-bs-toggle="modal" data-bs-target="#modalCalendarioAdmin">
                            📅 Ver Calendário Visual
                        </button>
                    </div>

                    <form id="form-reserva" class="row g-3 mb-5 border-bottom pb-4">
                        <input type="hidden" id="reserva-id">
                        <div class="col-md-4">
                            <label>Nome do Cliente</label>
                            <input type="text" id="reserva-nome" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label>Data do Evento</label>
                            <input type="date" id="reserva-data" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label>Status Pagamento</label>
                            <select id="reserva-status" class="form-select">
                                <option value="NAO_PAGO">🔴 Não Pago</option>
                                <option value="PARCIAL">🟡 Parcial</option>
                                <option value="PAGO">🟢 Pago</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label>Informações do Evento</label>
                            <textarea id="reserva-detalhes" class="form-control" rows="2" placeholder="Ex: Festa de 15 anos, buffet externo, DJ contratado..."></textarea>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-success" id="btn-salvar-reserva">Salvar na Agenda</button>
                            <button type="button" class="btn btn-secondary d-none" id="btn-cancelar-edicao" onclick="limparFormularioReserva()">Cancelar Edição</button>
                        </div>
                    </form>

                    <h4 class="text-primary border-bottom pb-2 mb-3">📅 Próximos Eventos</h4>
                    <div id="lista-reservas" class="row g-3 mb-5"></div>

                    <h4 class="text-secondary border-bottom pb-2 mb-3">📂 Histórico / Finalizados</h4>
                    <div id="lista-historico" class="row g-3"></div>
                </div>

                <div class="tab-pane fade" id="galeria-tab">
                    <h5 class="mb-3">Adicionar Foto</h5>
                    <form id="form-upload" class="row g-3 mb-5 border-bottom pb-4">
                        <div class="col-md-4">
                            <label>Título</label>
                            <input type="text" id="foto-titulo" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label>Categoria</label>
                            <select id="foto-categoria" class="form-select">
                                <option value="Casamento">Casamento</option>
                                <option value="Aniversario">Aniversário</option>
                                <option value="Infantil">Infantil</option>
                                <option value="Espaco">O Espaço</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label>Arquivo</label>
                            <input type="file" id="foto-arquivo" class="form-control" accept="image/*" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Enviar Foto</button>
                        </div>
                    </form>

                    <h5>Fotos no Site</h5>
                    <div id="lista-fotos-admin" class="row g-2"></div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCalendarioAdmin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl"> <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">Visão Geral da Agenda</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="calendarAdmin"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
